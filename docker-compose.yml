services:
  app:
    # 默认使用本地源码构建，确保包含当前仓库里的修复。
    build: .
    # 如果你确认要使用已发布镜像，可改成下面这行并注释掉 build：
    # image: ghcr.io/kasuha07/uestc-power-monitor:latest

    container_name: uestc-power-monitor
    restart: unless-stopped

    # 如需在容器内交互式输入凭据（启动时提示输入用户名/密码），可取消下面两行注释：
    # 注意：仅前台运行（docker compose run --rm app / docker start -ai）时交互才可见；
    # 后台启动时程序会检测到无人连接并直接报错退出（提示行在无人 TTY 上不可见）。
    # tty: true
    # stdin_open: true

    volumes:
      # 本地配置文件（建议先 cp config.toml.example config.toml）
      - ./config.toml:/app/config.toml:ro
      # SQLite 数据库和 Cookie 持久化目录
      - ./data:/app/data

    environment:
      TZ: Asia/Shanghai
      UPM_TIMEZONE: Asia/Shanghai
      UPM_DATABASE_URL: sqlite://data/power_monitor.db
      UPM_COOKIE_FILE: data/uestc_cookies.json

      # 如果你不想把账号密码写进 config.toml，也可以取消下面两行注释：
      # UPM_USERNAME: "2023xxxxxxx"
      # UPM_PASSWORD: "your_password"
      # 如使用 wechat 登录，或希望 Cookie 加密密钥独立于账号密码，请配置：
      # UPM_COOKIE_ENCRYPTION_KEY: "change-me-to-a-long-random-secret"

      # 如需代理可取消注释：
      # HTTPS_PROXY: http://proxy.example.com:8080
      # HTTP_PROXY: http://proxy.example.com:8080
