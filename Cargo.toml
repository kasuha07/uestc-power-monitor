[package]
name = "uestc-power-monitor"
version = "0.6.1"
edition = "2024"

[workspace]
members = ["vendor/uestc-client"]

[dependencies]
uestc-client = { path = "vendor/uestc-client" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
# Keep default-features off to avoid pulling unused backends (e.g. mysql) into security surface.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
openssl = { version = "0.10", features = ["vendored"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
rpassword = "7"
# 交互式输入时隐藏密码回显（跨平台，stdin 为终端时使用）

[dev-dependencies]
# test-util enables paused-clock tests so retry/backoff timing is deterministic.
tokio = { version = "1", features = ["full", "test-util"] }
