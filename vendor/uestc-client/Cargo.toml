[package]
edition = "2024"
name = "uestc-client"
version = "0.3.0"
authors = ["kasuha07 <me@kasuha.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A minimal reqwest client for UESTC."
readme = "README.md"
license = "MIT"
repository = "https://github.com/kasuha07/uestc-client"

[features]
async = ["dep:tokio"]
blocking = ["reqwest/blocking"]
default = ["async"]

[lib]
name = "uestc_client"
path = "src/lib.rs"

[[example]]
name = "async_wechat_login"
path = "examples/async_wechat_login.rs"

[[example]]
name = "blocking_wechat_login"
path = "examples/blocking_wechat_login.rs"

[[test]]
name = "bedroom_query_integration"
path = "tests/bedroom_query_integration.rs"

[dependencies.aes]
version = "0.8"

[dependencies.aes-gcm]
version = "0.10"

[dependencies.base64]
version = "0.22"

[dependencies.cbc]
version = "0.1"

[dependencies.cookie_store]
version = "0.22"

[dependencies.log]
version = "0.4"

[dependencies.pbkdf2]
version = "0.12"

[dependencies.qr2term]
version = "0.3"

[dependencies.quick-xml]
version = "0.39"

[dependencies.rand]
version = "0.9"

[dependencies.regex]
version = "1.12"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "cookies",
    "http2",
    "system-proxy",
    "default-tls",
]
default-features = false

[dependencies.reqwest_cookie_store]
version = "0.9"

[dependencies.scraper]
version = "0.24"

[dependencies.serde]
